name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check formatting
        run: ./format.sh --check

      - name: Download iOS simulator
        run: |
          n=0
          until [ "$n" -ge 5 ]
          do
            echo "Attempting download (Try $((n+1)))..."
            xcodebuild -downloadPlatform iOS && break
            n=$((n+1))
            echo "Download failed. Sleeping 10 seconds before retry..."
            sleep 10
          done

          if [ "$n" -ge 5 ]; then
            echo "Failed to download iOS simulator after 5 attempts."
            exit 1
          fi

      - name: Build AdvantageTune
        run: xcodebuild -project AdvantageTune.xcodeproj -scheme AdvantageTune -sdk iphonesimulator build
